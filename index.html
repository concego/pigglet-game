<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porquinho / Pigglet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game-container">
        <header>
            <h1 id="title">Porquinho</h1>
            <button id="lang-toggle">EN</button>
        </header>

        <section id="visual-area">
            <svg id="pig-svg" viewBox="0 0 200 200" width="120" height="120">
                <circle cx="100" cy="110" r="60" fill="#ffc0cb" />
                <circle cx="80" cy="90" r="5" fill="#000" />
                <circle cx="120" cy="90" r="5" fill="#000" />
                <ellipse cx="100" cy="115" rx="15" ry="10" fill="#ffb6c1" />
            </svg>
        </section>

        <section id="game-info">
            <div class="score-board">
                <p>P1: <strong id="p1-score">0</strong></p>
                <p>P2: <strong id="p2-score">0</strong></p>
            </div>
            <div id="current-turn-box">
                <h2 id="current-player-name">Vez de: Jogador 1</h2>
                <p>Rodada: <span id="current-points">0</span></p>
            </div>
            <div id="status-update" aria-live="polite"></div>
        </section>

        <section id="controls">
            <button id="btn-roll">Rolar</button>
            <button id="btn-hold">Salvar</button>
            <button id="btn-new">Novo Jogo</button>
        </section>
    </main>
    <script src="game.js"></script>
</body>
</html>
